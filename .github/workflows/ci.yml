name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: solar_dev
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: solar_management_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solar_dev -d solar_management_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://solar_dev:local-ci-only@127.0.0.1:5432/solar_management_dev
      TEST_DATABASE_URL: postgres://solar_dev:local-ci-only@127.0.0.1:5432/solar_management_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE solar_management_test'
      - run: npm run db:migrate && npm run db:seed
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  containers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ORIGIN: https://127.0.0.1:8443
      APP_IMAGE: solar-management:ci
      ROLLBACK_IMAGE: solar-management:ci-previous
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable container credentials
        run: |
          ci_database_password="$(openssl rand -hex 32)"
          echo "::add-mask::$ci_database_password"
          echo "DATABASE_PASSWORD=$ci_database_password" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check out the preceding verified container revision
        uses: actions/checkout@v4
        with:
          ref: 3e3798097bffe54d89bed18343f1730fe7f524d3
          path: .local/rollback-baseline
          persist-credentials: false
      - name: Build the compatible rollback image
        run: docker build --tag "$ROLLBACK_IMAGE" .local/rollback-baseline
      - run: docker compose --env-file .env.production.example -p sm-ci build app
      - run: docker compose --env-file .env.production.example -p sm-ci up -d --wait app
      - run: docker compose --env-file .env.production.example -p sm-ci run --rm migrate node server/dist/db/command.js seed
      - run: bash scripts/verify-containers.sh .env.production.example sm-ci
      - name: Create a temporary certificate for browser verification
        run: |
          mkdir -p .local
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .local/ci-key.pem -out .local/ci-cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.production.config.ts
      - name: Container logs
        if: failure()
        run: docker compose --env-file .env.production.example -p sm-ci logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Remove the disposable CI deployment
        if: always()
        run: docker compose --env-file .env.production.example -p sm-ci down -v
